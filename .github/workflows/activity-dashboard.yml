name: Update activity dashboard

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: activity-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_activity.py --user Daniel059 --out dist/activity-dashboard.svg

      - name: Publish to activity-assets branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin activity-assets >/dev/null 2>&1; then
            git fetch origin activity-assets
            git worktree add ../assets -B activity-assets origin/activity-assets
          else
            git worktree add --detach ../assets
            git -C ../assets checkout --orphan activity-assets
            git -C ../assets rm -rf . >/dev/null 2>&1 || true
          fi
          cp dist/activity-dashboard.svg ../assets/activity-dashboard.svg
          cd ../assets
          git add activity-dashboard.svg
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: update activity dashboard"
            git push origin activity-assets
          fi
